[app]
; Please configure a high-entropy JWT secret (e.g. openssl rand -hex 32)
; If left empty or 'message-nest', a random secret is automatically generated at startup.
JwtSecret = your-secure-random-jwt-secret
RuntimeRootPath = runtime/
LogLevel = INFO

; init table data, first run set enable
InitData = enable

[server]
; debug or release
RunMode = release
HttpPort = 8000
ReadTimeout = 60
WriteTimeout = 60
; use embed html static file
; EmbedHtml = disable
; URL prefix for sub-path deployment (e.g., /message-nest)
; UrlPrefix = /message-nest

[database]
; Type: sqlite / mysql / postgres
Type = mysql
User = root
Password = password
Host = 123.1.1.1
Name = db_name
Port = 3306
TablePrefix = message_

; ssl enable, value: [false | true]
Ssl = true

; SqlDebug = enable
