[app]
; Please configure a high-entropy JWT secret (e.g. openssl rand -hex 32)
; If left empty or 'message-nest', a random secret is automatically generated at startup.
JwtSecret = your-secure-random-jwt-secret
; Required only for the Aliyun SMS test API. Set a stable random value of at least 32 bytes.
; Every application replica must use the same value. Never log or rotate while tests are enabled.
; Can also be supplied as ALIYUN_SMS_TEST_FINGERPRINT_SECRET.
AliyunSMSTestFingerprintSecret =
LogLevel = INFO

[server]
HttpPort = 8000
ReadTimeout = 60
WriteTimeout = 60
; URL prefix for sub-path deployment (e.g., /message-nest)
; UrlPrefix = /message-nest

[database]
; Type: sqlite / mysql / postgres / tidb
Type = mysql
User = root
Password = password
Host = 123.1.1.1
Name = db_name
Port = 3306
TablePrefix = message_

; ssl enable, value: [false | true]
Ssl = true

; SqlDebug = enable
