[app]
; 请配置高熵 JWT 密钥（例如：openssl rand -hex 32）
; 若为空或使用 'message-nest'，服务启动时将自动生成随机临时密钥
JwtSecret = your-secure-random-jwt-secret
; 阿里云短信测试 API 限流指纹密钥；至少 32 字节高熵随机字符串，多副本部署必须保持一致
; 亦可通过环境变量 ALIYUN_SMS_TEST_FINGERPRINT_SECRET 注入
AliyunSMSTestFingerprintSecret =
LogLevel = INFO

[server]
HttpPort = 8000
ReadTimeout = 60
WriteTimeout = 60
; URL prefix for sub-path deployment (e.g., /message-nest)
; UrlPrefix = /message-nest

[database]
; Type: sqlite / mysql / postgres / tidb
Type = mysql
User = root
Password = password
Host = 123.1.1.1
Name = db_name
Port = 3306
TablePrefix = message_

; ssl enable, value: [false | true]
Ssl = true

; SqlDebug = enable
