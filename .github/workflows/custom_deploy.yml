name: custom-deploy-your-server

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.REPO_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate Tag Name
        id: tag
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "TAG=ghcr.io/engigu/message-nest:br-${SAFE_BRANCH}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tag.outputs.TAG }}
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Watchtower CD Update
        continue-on-error: true
        env:
          DEPLOY_CMD: ${{ secrets.WATCHTOWER_WEBHOOK_URL }}
        run: |
          if [ -z "$DEPLOY_CMD" ]; then
            echo "ℹ️ 未配置 WATCHTOWER_WEBHOOK_URL，跳过更新"
            exit 0
          fi
          echo "🚀 触发 Watchtower 容器自动更新..."
          eval "$DEPLOY_CMD"


