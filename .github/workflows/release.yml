name: Release-Message-Nest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: engigu/message-nest
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKER_PASSWD: ${{ secrets.DOCKER_PASSWD }}

jobs:
  build-artifacts:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'web/package-lock.json'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build Web
        run: |
          chmod +x ./scripts/build.sh
          ./scripts/build.sh web

      - name: Build Binaries for Release & Docker
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          ./scripts/build.sh release-artifacts release-pkg dist-assets

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: release-pkg/*
          retention-days: 1

      - name: Upload Docker Build Context
        uses: actions/upload-artifact@v4
        with:
          name: docker-artifacts
          path: dist-assets
          retention-days: 1

  publish-release:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    needs: build-artifacts
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Release Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: release-pkg

      - name: Prepare Release Notes
        run: |
          if [ -f .release_log ]; then
            # 提取最后一条更新日志，若不存在则使用完整 release_log
            tail -n 10 .release_log > RELEASE_NOTES.md
          else
            echo "Release ${{ github.ref_name }}" > RELEASE_NOTES.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-pkg/*

  build:
    if: github.event.repository.fork == false
    needs: build-artifacts
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Docker Build Context
        uses: actions/download-artifact@v4
        with:
          name: docker-artifacts
          path: dist-assets

      - name: Prepare build context
        run: |
          cp dist-assets/bin/linux-${{ matrix.arch }}/Message-Nest ./Message-Nest
          chmod +x ./Message-Nest
          rm -rf dist-assets

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKER_USER != '' && env.DOCKER_PASSWD != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWD }}

      - name: Configure image destinations
        id: dest
        run: |
          if [ -n "$DOCKER_USER" ] && [ -n "$DOCKER_PASSWD" ]; then
            cat <<EOF >> $GITHUB_OUTPUT
images<<END
ghcr.io/${{ env.IMAGE_NAME }}
docker.io/${{ env.IMAGE_NAME }}
END
outputs=type=image,"name=ghcr.io/${{ env.IMAGE_NAME }},docker.io/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
EOF
          else
            cat <<EOF >> $GITHUB_OUTPUT
images=ghcr.io/${{ env.IMAGE_NAME }}
outputs=type=image,"name=ghcr.io/${{ env.IMAGE_NAME }}",push-by-digest=true,name-canonical=true,push=true
EOF
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.dest.outputs.images }}
          flavor: |
            latest=false

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ci
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: ${{ steps.dest.outputs.outputs }}
          provenance: false

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-linux-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: [build, build-artifacts]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-linux-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: ${{ env.DOCKER_USER != '' && env.DOCKER_PASSWD != '' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ env.IMAGE_NAME }}
            docker.io/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          # GHCR 多架构合并推送 (版本号 + latest)
          docker buildx imagetools create \
            $(jq -cr '.tags | map(select(startswith("ghcr.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf 'ghcr.io/${{ env.IMAGE_NAME }}@sha256:%s ' *)

          # Docker Hub 多架构合并推送 (版本号 + latest)
          if [ -n "$DOCKER_USER" ]; then
            docker buildx imagetools create \
              $(jq -cr '.tags | map(select(startswith("docker.io"))) | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
              $(printf 'docker.io/${{ env.IMAGE_NAME }}@sha256:%s ' *)
          fi
